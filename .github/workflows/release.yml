name: Publish GitHub Release

# Merging a PR into main causes a push. The version in app.config.json
# determines the release tag; re-runs do not publish duplicate releases.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arrow-viewer-github-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository with tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check version and existing release
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content -Raw -Encoding utf8 app.config.json | ConvertFrom-Json
          $version = [string]$config.version
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$') {
            throw "app.config.json has an invalid release version: $version"
          }

          $tag = "v$version"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          $published = gh release view $tag --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ([string]$published -eq 'true') {
              throw "A draft release exists for $tag. Review the incomplete draft before retrying."
            }
            Write-Host "$tag already has a published GitHub Release. Nothing to do."
            "publish=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          $head = (git rev-parse HEAD).Trim()
          $tagCommit = git rev-parse -q --verify "refs/tags/$tag^{commit}" 2>$null
          $tagExists = $LASTEXITCODE -eq 0
          if ($tagExists -and $tagCommit.Trim() -ne $head) {
            throw "Tag $tag exists on $tagCommit, not $head. Bump app.config.json instead of moving an existing tag."
          }
          "tag_exists=$(if ($tagExists) { 'true' } else { 'false' })" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "publish=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build and verify both standalone HTML variants
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Create version tag and GitHub Release
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          TAG_EXISTS: ${{ steps.version.outputs.tag_exists }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TAG_EXISTS -eq 'false') {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a $env:RELEASE_TAG -m "Arrow Viewer $env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw "Could not create tag $env:RELEASE_TAG" }
            git push origin "refs/tags/$env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw "Could not push tag $env:RELEASE_TAG" }
          }

          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $readable = "release-assets/arrow-viewer-$env:RELEASE_TAG.html"
          $selfExtract = "release-assets/arrow-viewer-$env:RELEASE_TAG.self-extract.html"
          Copy-Item dist/index.html $readable
          Copy-Item dist/index.self-extract.html $selfExtract
          $arguments = @('release', 'create', $env:RELEASE_TAG, $readable, $selfExtract,
            '--verify-tag', '--title', "Arrow Viewer $env:RELEASE_TAG", '--generate-notes')
          if ($env:RELEASE_TAG -match '-') { $arguments += '--prerelease' }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "Could not publish GitHub Release $env:RELEASE_TAG" }
